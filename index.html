<!DOCTYPE html>
<html lang="es">


<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>


<body>
    <!-- Menú -->
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand"><i class="bi bi-shop"></i> Gestión de inventario</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <li><a class="nav-link active" data-section="lista" href="#">Ver productos</a></li>
                        <li><a class="nav-link" data-section="agregar" href="#">Agregar producto</a></li>
                    </div>
                </div>
            </div>
        </nav>
    </header>


    <main>
        <!-- Lista de productos -->
        <section id="seccion-lista" class="seccion active">
            <h2>Lista de productos</h2>
            <div class="tabla-productos-wrapper">
                <table id="tabla-productos" class="table">
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Categoría</th>
                            <th scope="col">Precio</th>
                            <th scope="col">Stock</th>
                            <th scope="col">Estado</th>
                            <th scope="col">Descripción</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla"></tbody>
                </table>
            </div>
        </section>


        <section id="seccion-agregar" class="seccion">
            <h2>Agregar nuevo producto</h2>
            <div id="formulario">


                <input class="inputForm" type="hidden" id="producto-id" value="">


                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input class="inputForm" type="text" id="nombre" placeholder="ej: Café helado" required>
                </div>


                <div class="form-group">
                    <label for="categoria">Categoría</label>
                    <select class="inputForm" id="categoria" required>
                        <option value="" disabled selected>Seleccione categoría</option>
                        <option value="Bebidas Calientes">Bebidas Calientes</option>
                        <option value="Bebidas Frías">Bebidas Frías</option>
                        <option value="Postres">Postres</option>
                        <option value="Sandwiches y Salados">Sandwiches y Salados</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="precio">Precio</label>
                    <input class="inputForm" type="number" id="precio" placeholder="ej: 12.00" min="0" step="0.01"
                        required>
                </div>


                <div class="form-group">
                    <label for="stock">Stock</label>
                    <input class="inputForm" type="number" id="stock" placeholder="ej: 12" min="0" required>
                </div>


                <div class="form-group">
                    <label for="descripcion">Descripcion</label>
                    <textarea class="inputForm" id="descripcion"
                        placeholder="ej: Una rica bebida fria (opcional)" rows="3"></textarea>
                </div>


                <button class="btn btn-outline-success" id="btn-guardar" onclick="agregarProducto()">Agregar
                    producto</button>
                <button class="btn btn-outline-danger" id="btn-cancelar" onclick="cancelarAccion()">Cancelar</button>
            </div>
        </section>
    </main>


    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


</body>


</html>
